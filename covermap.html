<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<title>COVERMAP - Risk Analyzer</title>
<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  margin: 0;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
h1 { color: #0B1F3B; }
button {
  background: #2D6CDF;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 6px;
  cursor: pointer;
}
input {
  width: 100%;
  padding: 8px;
  margin: 5px 0 10px;
}
.result {
  font-size: 18px;
}
.red { color: #E74C3C; }
.orange { color: #F39C12; }
.green { color: #2ECC71; }
.bar {
  height: 20px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
}
.bar-inner {
  height: 100%;
  background: #2D6CDF;
}
</style>
</head>

<body>
<div class="container">

<h1>COVERMAP</h1>

<div class="card">
<h3>Στοιχεία Πελάτη</h3>

<label>Ηλικία</label> <input type="number" id="age">

<label>Ετήσιο Εισόδημα (€)</label> <input type="number" id="income">

<label>Ετήσια Έξοδα (€)</label> <input type="number" id="expenses">

<label>Δάνεια (€)</label> <input type="number" id="loans">

<label>Αποταμιεύσεις (€)</label> <input type="number" id="savings">

<button onclick="analyze()">Ανάλυση</button>

</div>

<div id="results" style="display:none;">

<div class="card">
<h3>Risk Score</h3>
<div id="score"></div>
</div>

<div class="card">
<h3>Κάλυψη Ζωής</h3>
<p id="lifeNeed"></p>
<div class="bar">
  <div id="lifeBar" class="bar-inner"></div>
</div>
</div>

<div class="card">
<h3>Συμπέρασμα</h3>
<p id="insight"></p>
</div>

<div class="card">
<h3>Πρόταση</h3>
<p id="recommendation"></p>
</div>

</div>

</div>

<script>
function analyze() {
  let age = parseInt(document.getElementById('age').value) || 0;
  let income = parseInt(document.getElementById('income').value) || 0;
  let expenses = parseInt(document.getElementById('expenses').value) || 0;
  let loans = parseInt(document.getElementById('loans').value) || 0;
  let savings = parseInt(document.getElementById('savings').value) || 0;

  let lifeNeed = (income * 15) + loans - savings;
  let coverage = savings;
  let gap = lifeNeed - coverage;

  let score = Math.min(100, Math.floor((gap / lifeNeed) * 100));

  document.getElementById('results').style.display = 'block';

  document.getElementById('score').innerHTML =
    score > 70 ? "<span class='red'>" + score + " / 100 (Υψηλός Κίνδυνος)</span>" :
    score > 40 ? "<span class='orange'>" + score + " / 100 (Μέτριος)</span>" :
    "<span class='green'>" + score + " / 100 (Χαμηλός)</span>";

  document.getElementById('lifeNeed').innerText =
    "Ανάγκη: " + lifeNeed.toLocaleString() + "€ | Έλλειμμα: " + gap.toLocaleString() + "€";

  let percent = Math.min(100, (coverage / lifeNeed) * 100);
  document.getElementById('lifeBar').style.width = percent + "%";

  document.getElementById('insight').innerText =
    "Σε περίπτωση απώλειας εισοδήματος, υπάρχει σημαντικό οικονομικό κενό για την οικογένεια.";

  document.getElementById('recommendation').innerText =
    "Προτείνεται ενίσχυση κάλυψης ζωής κατά περίπου " + gap.toLocaleString() + "€.";
}
</script>

</body>
</html>
